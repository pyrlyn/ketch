# Developer tools that are not crate dependencies, pinned so every machine and
# every agent runs the same one. The Rust entry is the one Rust version for local
# work, CI and release builds; bump it here and nowhere else. The MSRV
# (rust-version = 1.86 in Cargo.toml) is a separate promise and does not follow it.
[tools]
"cargo:https://github.com/pyrlyn/tools" = "rev:90448075a5ff0f2fe3ae69579ed333b18dcfcd51" # `mise run sweep`, `just cache`, `just swarfr` (ptools)
"cargo:cargo-sweep" = "0.8.0" # `mise run sweep`: drops build artifacts unused for 1 day (ptools sweep)
mold = { version = "2.42.1", os = ["linux"] } # linker, Linux only; mise [env] below turns it on where it is installed
sccache = { version = "0.18.0", os = ["linux", "macos"] } # compiler cache; mise [env] below makes it the rustc wrapper where it is installed
rust = { version = "1.98.1", components = "rustfmt,clippy" } # mise installs the minimal profile otherwise
"cargo:cargo-cache" = "0.8.3" # `just cache` / `just cache-autoclean`; the shared cargo home fills up
"cargo:https://github.com/pyrlyn/tools" = "rev:d8658b36d8384c24696b183ee07c8f418502dceb" # `just cache`, `just swarfr` (ptools, pyrlyn/tools#1; repin to a v0.1.0 tag once merged)
node = "24.20.0"              # commitlint for `just lint-commits` and the commit-msg hook; node-based checks live in Just and CI only
ruby = "3.4.11"               # `just lint-shell` -> tests/release-workflows.sh parses the workflows with ruby
cargo-dist = "0.32.0" # generates .github/workflows/release.yml and builds the release tarballs (`just dist-generate`, `just package`)
git-cliff = "2.13.1" # writes the CHANGELOG.md entry for a release, from cliff.toml (`scripts/release.sh`, and release-plz on its pull request)
xcodegen = "2.46.0" # generates desktop/macos/Ketch.xcodeproj from project.yml (`just macos-app`, `just macos-test`); the project file is not committed
"cargo:cargo-fuzz" = "0.13.2" # `just fuzz`; runs with `cargo +nightly`, a rustup toolchain outside this pin (fuzz/README.md)
"cargo:https://github.com/dennisameling/uniffi-bindgen-cs" = "rev:0fc022aa1d73fb1dda91a778b63f2824d7dca58b" # C# bindings for ketch-ffi (`just csharp`): PR #176 of NordSecurity/uniffi-bindgen-cs, the only generator for UniFFI 0.32 (D10)
dotnet = "10.0.401" # builds and runs the C# binding's tests in desktop/windows (`just csharp-test`)
"cargo:cargo-hakari" = "0.9.39" # workspace-hack unification; CI runs `cargo hakari verify`

[env]
# mold as the Linux linker only where mise has installed it (clang is the driver, mold is not one):
# without mold the variable is empty and the default linker stays. Not in .cargo/config.toml: a missing
# mold or clang there would break every Linux build, CI included. Cargo takes the target rustflags only when
# RUSTFLAGS is unset. Rust >= 1.90 already links x86_64-unknown-linux-gnu with rust-lld. macOS keeps Apple
# ld (mold has no macOS support); Windows uses rust-lld through .cargo/config.toml.
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "{% if os() == 'linux' and get_env(name='MISE_MOLD_PROBE', default='') == '' %}{{ exec(command='MISE_MOLD_PROBE=1 \"' ~ mise_bin ~ '\" which mold >/dev/null 2>&1 && echo \"-C linker=clang -C link-arg=-fuse-ld=mold\" || true') }}{% endif %}"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS = "{% if os() == 'linux' and get_env(name='MISE_MOLD_PROBE', default='') == '' %}{{ exec(command='MISE_MOLD_PROBE=1 \"' ~ mise_bin ~ '\" which mold >/dev/null 2>&1 && echo \"-C linker=clang -C link-arg=-fuse-ld=mold\" || true') }}{% endif %}"
# sccache as the rustc wrapper only where mise has it installed; empty means no wrapper (CI jobs
# that install just Rust, Windows, machines without the tool). Not in .cargo/config.toml: there a
# missing sccache would break every build. The probe variable stops `mise which` from recursing
# into this same template. CI backend (R2): .github/actions/sccache, where the repo has its own jobs.
RUSTC_WRAPPER = "{% if os() != 'windows' and get_env(name='MISE_SCCACHE_PROBE', default='') == '' %}{{ exec(command='MISE_SCCACHE_PROBE=1 \"' ~ mise_bin ~ '\" which sccache 2>/dev/null || true') }}{% endif %}"

[tasks.sweep]
description = "Remove cargo build artifacts unused for 1 day (cargo-sweep, via ptools)"
run = "ptools sweep --days 1"

[tasks.sweep-dry]
description = "Preview what sweep would remove; deletes nothing"
run = "ptools sweep --days 1 --dry-run"
