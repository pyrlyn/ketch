# Overrides on top of the shared ci-diffuser and default detekt config, the same ones octo uses.
style:
  MagicNumber:
    excludes: ['**/commonTest/**', '**/nativeTest/**', '**/jvmTest/**', '**/macosTest/**', '**/test/**']
    # A named property already says what its number means.
    ignorePropertyDeclaration: true

complexity:
  TooManyFunctions:
    allowedFunctionsPerClass: 25
    allowedFunctionsPerFile: 25
    # A ported test class mirrors one Rust test file, test for test.
    excludes: ['**/commonTest/**', '**/nativeTest/**', '**/jvmTest/**', '**/macosTest/**', '**/test/**']
