# Overrides on top of the shared-settings and default detekt config, the same ones octo uses.
style:
  MagicNumber:
    excludes: ['**/*Test/**', '**/test/**']
    # A named property already says what its number means.
    ignorePropertyDeclaration: true

complexity:
  TooManyFunctions:
    allowedFunctionsPerClass: 25
    allowedFunctionsPerFile: 25
    # A ported test class mirrors one Rust test file, test for test.
    excludes: ['**/*Test/**', '**/test/**']

naming:
  FunctionNaming:
    # Compose names its UI functions like types.
    ignoreAnnotated: ['Composable']
