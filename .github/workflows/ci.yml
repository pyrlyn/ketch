name: ci

# CI runs on pushes and merges to main, and on pull requests targeting main
# (not drafts — review happens when the PR is marked ready).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

# Build and test jobs need only to read the repository; a job that needs more
# (review) declares its own.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # infra's config action on .github/infra.yml: `docs-only` is "true" when every changed file
  # is documentation (fails open: "false" when unsure, e.g. a .github/ change). The jobs below
  # then do no work but still report under their names, so the required checks pass. A failed
  # `config` runs everything.
  config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

  # The shared pyrlyn/ci workflow, pinned by commit, with Rust from
  # mise.toml and a check that rustc is that pin: fmt once, then per target of
  # its shared matrix clippy (--all-targets --all-features, so the tui feature
  # is linted too), check, and the tests on every target (Linux x86_64 and
  # aarch64, macOS aarch64, Windows x86_64; macOS is Apple Silicon only). The
  # tests are the unit tests and the offline
  # end-to-end suite in tests/ (install_linux.rs, install_windows.rs and the
  # macOS ones are cfg-gated to their platform), default build and the
  # optional TUI feature, which is not in the release tarball but must still
  # compile and pass.
  rust:
    # Draft PRs are skipped here and reported green: review happens when the PR
    # is marked ready, and a draft must not look broken meanwhile.
    needs: config
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
    # actions: write for infra's cancel-run (the first failing job cancels the run).
    permissions:
      contents: read
      actions: write
    with:
      tools: nextest
      test-command: |
        cargo nextest run --workspace --all-targets --locked
        cargo nextest run --workspace --all-targets --locked --features tui
      build-command: cargo build --workspace --all-targets --all-features --locked --target "$TARGET"
      # Docs-only: every job is a no-op that still reports (`rust / <target>` stay required).
      skip: ${{ needs.config.outputs.docs-only == 'true' }}

  # Commits pushed from anywhere but this machine never met the local
  # commit-msg hook, so a pull request's messages are linted here too, with
  # the repository's commitlint config (pyrlyn/ci's `commits` action: merge
  # commits and git's "Revert ..." subjects are skipped, every offender is
  # listed). Pushes to main skip this: every commit there arrived through a
  # pull request that already passed it.
  commits:
    if: github.event.pull_request.draft != true && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the check ranges from the pull request's base branch to HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pyrlyn/ci/.github/actions/commits@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
        with:
          tool: commitlint

  # install.ps1 parses and runs; the Rust side of Windows is the `rust` job.
  powershell:
    needs: config
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List *; exit 1 }
          ./install.ps1 --help

  # The macOS app (desktop/macos) is Swift only: its own job beside the Rust
  # ones, not in front of them. XcodeGen at the mise.toml pin; the runner's
  # default Xcode (26.x on macos-26) is new enough for the macOS 26 target.
  macos-app:
    needs: config
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: macos-26
    defaults:
      run:
        working-directory: desktop/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: xcodegen

      - name: Format
        run: xcrun swift-format lint --strict -r Ketch KetchTests KetchUITests KetchCore/Package.swift KetchCore/Tests

      - name: Generate the project
        run: |
          xcodebuild -version
          xcodegen generate --spec project.yml

      # Apple Silicon (arm64) only, unsigned: what `just macos-app` builds.
      - name: Build
        run: >-
          xcodebuild -project Ketch.xcodeproj -scheme Ketch -derivedDataPath build
          -configuration Debug -destination 'generic/platform=macOS'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build

      - name: Test
        run: >-
          xcodebuild -project Ketch.xcodeproj -scheme Ketch -derivedDataPath build
          -destination 'platform=macOS' test

  # ketch-ffi as the macOS app will link it: the XCFramework for both
  # architectures, the Swift bindings UniFFI generates from it, and the Swift
  # test that runs the real core against a scratch root through them. What
  # `just ffi-test` runs. On every gate run, not only when crates/ changes:
  # nearly every change to the core can change the bindings, and a path filter
  # would need another action. Kept cheap: the dev profile, one runner, and
  # rust-cache; it does not block the Rust jobs.
  ketch-ffi:
    needs: config
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pyrlyn/ci/.github/actions/setup-rust@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

      - uses: Swatinem/rust-cache@v2

      - name: XCFramework and bindings
        run: scripts/xcframework.sh --debug

      - name: Swift test
        run: swift test --package-path desktop/macos/KetchCore

  # ketch-ffi as the Windows app will link it: ketch_ffi.dll, the C# bindings
  # the pinned uniffi-bindgen-cs generates from it, and the .NET test that runs
  # the real core against a scratch root through them. What `just csharp-test`
  # runs. The generator and the .NET SDK are mise.toml pins.
  ketch-cs:
    needs: config
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pyrlyn/ci/.github/actions/setup-rust@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
        with:
          install-args: rust dotnet cargo:https://github.com/dennisameling/uniffi-bindgen-cs

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Library and bindings
        run: scripts/csharp.sh --debug

      - name: .NET test
        working-directory: desktop/windows
        run: dotnet test --project KetchCore.Tests

  # ketch-capi as the Linux app will link it: the shared library, and the Vala
  # test Meson builds against vapi/ketch.vapi and runs against a scratch root.
  # What `just capi-test` runs. The header and schema drift tests run in the
  # rust job with the rest of the workspace.
  ketch-capi:
    needs: config
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pyrlyn/ci/.github/actions/setup-rust@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # mise has no valac or json-glib, so the Vala toolchain is the
      # distribution's, on the runner only.
      - name: Vala toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valac meson ninja-build libjson-glib-dev

      - name: Library
        run: cargo build --locked -p ketch-capi

      - name: Vala test
        run: |
          meson setup target/capi-meson crates/ketch-capi -Dcapi_dir="$PWD/target/debug"
          meson test -C target/capi-meson --print-errorlogs

  # The Windows app: the fake core and store tested against the contract
  # scenarios, then the WinUI 3 project built with the .NET SDK alone (the
  # runner's Visual Studio is not used: the XAML compiler and the Windows SDK
  # build tools come from the Microsoft.WindowsAppSDK package). The tests run
  # on any OS; only the build needs Windows. The .NET SDK is a mise.toml pin.
  ketch-win-app:
    needs: config
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: dotnet

      - name: App core tests
        run: dotnet test --project Ketch.AppCore.Tests

      - name: Build the WinUI app
        run: dotnet build Ketch.App/Ketch.App.csproj -c Release -p:Platform=x64

  # The design tokens: every generated copy (Swift, XAML, GTK CSS, DESIGN.md,
  # preview.html) is what desktop/design/build.mjs writes from tokens.json, DESIGN.md passes
  # the DESIGN.md linter, and text meets WCAG AA on its glass backgrounds.
  # Offline after npm ci; the same steps as `just design-check`.
  design:
    needs: config
    if: >-
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Node pin from mise.toml
        id: node_pin
        run: |
          version=$(grep '^node = ' mise.toml | cut -d '"' -f2)
          [ -n "$version" ] || { echo "no node pin found in mise.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node_pin.outputs.version }}

      - name: Design tokens
        run: |
          npm ci
          node desktop/design/build.mjs
          # status, not diff: a generated file nobody committed is untracked.
          [ -z "$(git status --porcelain -- desktop)" ] \
              || { git status --porcelain -- desktop; echo "design tokens are stale: run just design-tokens and commit" >&2; exit 1; }
          node desktop/design/contrast.mjs
          npx --no-install designmd lint desktop/macos/DESIGN.md > lint.json \
              || { cat lint.json; exit 1; }

  # Packaging is exercised on every pull request, so it breaks here rather than
  # halfway through a release, after the merge that started one.
  package:
    # A matrix job skipped at job level reports one check under its raw name, so the required
    # `package (<os>, <target>)` checks would wait: on a docs-only change every step is a no-op.
    needs: config
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.config.outputs.docs-only != 'true' }}
    defaults:
      run:
        shell: bash
    steps:
      # Tags are required by tests/crate-version.sh (latest tag vs Cargo.toml).
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # dist builds the tarball exactly as release.yml does, with the Rust
      # release.yml installs; git-cliff is what tests/release-sh.sh runs
      # scripts/release.sh against. All three at the versions mise.toml pins.
      # Before rust-cache, so the cache keys on this rustc.
      - if: env.RUN == 'true'
        uses: pyrlyn/ci/.github/actions/setup-rust@4e652d891cc6e6f0be316eda1a1f9630d76a8b7e # main
        with:
          install-args: rust cargo-dist git-cliff

      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@v2

      - if: env.RUN == 'true'
        name: Shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/release.sh
          bash -n scripts/dist-generate.sh
          sh tests/release-sh.sh
          sh tests/crate-version.sh
          sh tests/release-workflows.sh
          sh tests/ci-yml-triggers.sh
          sh tests/desktop-release.sh

      # src/lib.rs and the core's fuzz entry points exist only under
      # cfg(fuzzing), which no other build sets; checked on stable here so they
      # cannot rot unnoticed again until someone runs the nightly fuzz build.
      # What `just fuzz-check` runs.
      - name: The fuzzing library compiles
        if: env.RUN == 'true' && runner.os == 'macOS'
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo check --locked -p ketch -p ketch-core

      # release.yml is generated; a dist-workspace.toml or build-*.yml change
      # without `just dist-generate` would ship a workflow nobody reviewed.
      - name: release.yml is what dist generates
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: |
          DIST=dist scripts/dist-generate.sh
          git diff --exit-code -- .github/workflows/release.yml

      - if: env.RUN == 'true'
        name: Package the host target
        run: dist build --artifacts=local --target ${{ matrix.target }}

      # Everything install.sh relies on: an aggregate SHA256SUMS it can grep, a
      # checksum that verifies, and a `ketch` binary it can find and run.
      - if: env.RUN == 'true'
        name: The tarball is what install.sh expects
        run: |
          cd target/distrib
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ketch-*.tar.gz > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
            hash() { shasum -a 256 "$1" | awk '{print $1}'; }
          else
            sha256sum ketch-*.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
            hash() { sha256sum "$1" | awk '{print $1}'; }
          fi

          tarball=ketch-${{ matrix.target }}.tar.gz
          expected=$(grep "$tarball" SHA256SUMS | awk '{print $1}')
          actual=$(hash "$tarball")
          [ "$expected" = "$actual" ] || { echo "checksum line unusable" >&2; exit 1; }

          mkdir -p unpacked && tar -xzf "$tarball" -C unpacked
          binary=$(find unpacked \( -name ketch -o -name ketch.exe \) -type f | head -1)
          [ -n "$binary" ] || { echo "no ketch binary in the tarball" >&2; exit 1; }
          "$binary" --version

      # The cask is generated too, and the `tap` job checks it with `brew
      # style` — after the release has published, where a rejected cask leaves
      # the tap a version behind and needs a whole new release to fix. The
      # checksums are placeholders; rubocop only reads the shape of the file.
      # `brew style` applies its cask rules by the `Casks/` directory name.
      - name: The generated cask passes brew style
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: |
          mkdir -p cask/Casks
          scripts/cask.sh 0.0.0 "$(printf '%064d' 0)" > cask/Casks/ketch.rb
          brew style cask/Casks/ketch.rb

  # A `/review` comment in a pull request re-runs CI on that PR's head by
  # dispatching ci.yml on the PR's branch. The default token cannot dispatch
  # (that needs `workflow_dispatch` callers with write access), so this job
  # only runs where the commenter could push — same visibility as the branch.
  review:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Re-run CI on this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          head="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
          [ -n "$head" ] || { echo "could not read the head of #$PR" >&2; exit 1; }
          branch="$(gh pr view "$PR" --json headRefName -q .headRefName)"
          # The default token cannot re-run a workflow run, and `gh run rerun`
          # re-runs the whole run including skipped-on-draft jobs — so dispatch
          # CI fresh on the PR's branch instead. A dispatch on the branch runs
          # the pull_request jobs below against the same head.
          gh workflow run ci.yml --ref "$branch"
          gh pr comment "$PR" --body "CI dispatched on \`$branch\` (\`$head\`)."
