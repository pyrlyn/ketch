name: ci

# CI runs on pushes and merges to main, and on pull requests targeting main
# (not drafts — review happens when the PR is marked ready).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

# Build and test jobs need only to read the repository; a job that needs more
# (review) declares its own.
permissions:
  contents: read

# A /review comment must not share a group with a push to main. On
# issue_comment there is no pull request number, so `ci-${{ github.ref }}`
# was `ci-refs/heads/main`, and GitHub cancels the previous pending run in a
# group — a comment replaced a push that had not started. The comment run
# only dispatches CI, so it takes a group of its own.
concurrency:
  group: ${{ github.event_name == 'issue_comment' && format('review-{0}', github.event.issue.number) || format('ci-{0}', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # infra's config action on .github/infra.yml: `docs-only` is "true" when every changed file
  # is documentation (fails open: "false" when unsure, e.g. a .github/ change). The jobs below
  # then do no work but still report under their names, so the required checks pass. A failed
  # `config` runs everything.
  config:
    # A comment only dispatches CI (the review job). This job, and every job
    # but review, stays off that run: `pull_request.draft != true` is true
    # when the event has no pull request.
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.config.outputs.docs-only }}
    steps:
      - id: config
        uses: pyrlyn/ci/.github/actions/config@main

  # The shared pyrlyn/ci workflow, pinned by commit, with Rust from
  # mise.toml and a check that rustc is that pin: fmt once, then per target of
  # its shared matrix clippy (--all-targets --all-features, so the tui feature
  # is linted too), check, and the tests on every target (Linux x86_64 and
  # aarch64, macOS aarch64, Windows x86_64; macOS is Apple Silicon only). The
  # tests are the unit tests and the offline
  # end-to-end suite in tests/ (install_linux.rs, install_windows.rs and the
  # macOS ones are cfg-gated to their platform), default build and the
  # optional TUI feature, which is not in the release tarball but must still
  # compile and pass.
  rust:
    # Draft PRs are skipped here and reported green: review happens when the PR
    # is marked ready, and a draft must not look broken meanwhile.
    needs: config
    if: ${{ github.event_name != 'issue_comment' && !cancelled() && github.event.pull_request.draft != true }}
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@main
    # actions: write for infra's cancel-run (the first failing job cancels the run).
    permissions:
      contents: read
      actions: write
    # Only the sccache R2 pair the workflow declares, not every repository secret.
    secrets:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    with:
      sccache: true
      nextest-archive: true
      nextest-archive-args: --workspace --all-targets --locked
      tools: nextest
      test-command: |
        cargo nextest run --archive-file "$NEXTEST_ARCHIVE" --workspace-remap .
        cargo nextest run -p ketch --all-targets --locked --features tui
      build-command: cargo build --workspace --all-targets --all-features --locked --target "$TARGET"
      # Docs-only: every job is a no-op that still reports (`rust / <target>` stay required).
      skip: ${{ needs.config.outputs.docs-only == 'true' }}

  # Commits pushed from anywhere but this machine never met the local
  # commit-msg hook, so a pull request's messages are linted here too, with
  # the repository's commitlint config (pyrlyn/ci's `commits` action: merge
  # commits and git's "Revert ..." subjects are skipped, every offender is
  # listed). Pushes to main skip this: every commit there arrived through a
  # pull request that already passed it.
  commits:
    if: github.event.pull_request.draft != true && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the check ranges from the pull request's base branch to HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pyrlyn/ci/.github/actions/commits@main
        with:
          tool: commitlint

  # install.ps1 parses and runs; the Rust side of Windows is the `rust` job.
  powershell:
    needs: config
    if: >-
      github.event_name != 'issue_comment' &&
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List *; exit 1 }
          ./install.ps1 --help

      # pwsh 7 accepts Join-Path's third child; Windows PowerShell 5.1, the
      # shell `irm | iex` runs in, does not. This step goes past extraction.
      - name: Installer past extraction on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'ketch-b94-release'
          $nested = Join-Path $release 'staging\ketch'
          New-Item -ItemType Directory -Path $nested -Force | Out-Null
          $stub = Join-Path $nested 'ketch.exe'
          Add-Type -OutputType ConsoleApplication -OutputAssembly $stub -TypeDefinition @'
          using System;
          using System.IO;
          using System.Reflection;
          public class Program {
              public static int Main(string[] args) {
                  if (args.Length >= 2 && args[0] == "self" && args[1] == "install") {
                      string root = Environment.GetEnvironmentVariable("KETCH_ROOT");
                      if (string.IsNullOrEmpty(root)) return 2;
                      string bin = Path.Combine(root, "bin");
                      Directory.CreateDirectory(bin);
                      File.Copy(Assembly.GetExecutingAssembly().Location, Path.Combine(bin, "ketch.exe"), true);
                      return 0;
                  }
                  Console.WriteLine("ketch (stub)");
                  return 0;
              }
          }
          '@
          $tar = Join-Path $release 'payload.tar.gz'
          & tar.exe -czf $tar -C (Join-Path $release 'staging') ketch
          if ($LASTEXITCODE -ne 0) { throw "tar failed: $LASTEXITCODE" }
          $name = 'ketch-x86_64-pc-windows-msvc.tar.gz'
          $hash = (Get-FileHash -LiteralPath $tar -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath (Join-Path $release 'SHA256SUMS') -Encoding ascii -Value "$hash  $name"
          $root = Join-Path $env:RUNNER_TEMP 'ketch-b94-root'
          $env:KETCH_INSTALL_RELEASE_DIR = $release
          $env:PROCESSOR_ARCHITECTURE = 'AMD64'
          & .\install.ps1 --no-modify-path --root $root
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          $installed = Join-Path $root 'bin\ketch.exe'
          if (-not (Test-Path -LiteralPath $installed)) { throw "missing $installed" }

  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset = the hosted labels below, xcode-27-local = the dedicated Mac).
  macos-runner:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.app.outputs.value }}
      package: ${{ steps.package.outputs.value }}
    steps:
      - id: app
        uses: pyrlyn/ci/.github/actions/macos-runner@main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-26"]'
      - id: package
        uses: pyrlyn/ci/.github/actions/macos-runner@main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          key: runner
          value: >-
            [{"os":"macos-latest","runner":"macos-latest","target":"aarch64-apple-darwin"},
            {"os":"ubuntu-latest","runner":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
            {"os":"windows-latest","runner":"windows-latest","target":"x86_64-pc-windows-msvc"}]

  # The macOS app (desktop/macos) is Swift only: its own job beside the Rust
  # ones, not in front of them. XcodeGen at the mise.toml pin; the runner's
  # default Xcode (26.x on macos-26) is new enough for the macOS 26 target.
  macos-app:
    needs: [config, macos-runner]
    if: >-
      github.event_name != 'issue_comment' &&
      vars.MACOS_CI_DISABLED != 'true' &&
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: ${{ fromJSON(needs.macos-runner.outputs.app)[0] }}
    defaults:
      run:
        working-directory: desktop/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: xcodegen

      # Inline copy of pyrlyn/ci's swift-cache action (pyrlyn/ci#80): re-pin to it once merged.
      - name: Swift build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            desktop/macos/build
          key: swift-app-${{ runner.os }}-${{ runner.arch }}-xcode-${{ hashFiles('desktop/macos/**/Package.resolved', 'desktop/macos/**/Package.swift', 'desktop/macos/project.yml') }}-${{ github.sha }}
          restore-keys: |
            swift-app-${{ runner.os }}-${{ runner.arch }}-xcode-${{ hashFiles('desktop/macos/**/Package.resolved', 'desktop/macos/**/Package.swift', 'desktop/macos/project.yml') }}-
            swift-app-${{ runner.os }}-${{ runner.arch }}-xcode-

      - name: Format
        run: xcrun swift-format lint --strict -r Ketch KetchTests KetchUITests KetchCore/Package.swift KetchCore/Tests

      # The app links KetchCore. The framework and the generated bindings are
      # build output, same as the ketch-ffi job's `--debug` library.
      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: XCFramework and bindings
        working-directory: ${{ github.workspace }}
        run: scripts/xcframework.sh --debug

      - name: Generate the project
        run: |
          xcodebuild -version
          xcodegen generate --spec project.yml

      # Apple Silicon (arm64) only, unsigned: what `just macos-app` builds.
      - name: Build
        run: >-
          xcodebuild -project Ketch.xcodeproj -scheme Ketch -derivedDataPath build
          -configuration Debug -destination 'generic/platform=macOS'
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO build

      - name: Test
        run: >-
          xcodebuild -project Ketch.xcodeproj -scheme Ketch -derivedDataPath build
          -destination 'platform=macOS' test

  # ketch-ffi as the macOS app will link it: the XCFramework for both
  # architectures, the Swift bindings UniFFI generates from it, and the Swift
  # test that runs the real core against a scratch root through them. What
  # `just ffi-test` runs. On every gate run, not only when crates/ changes:
  # nearly every change to the core can change the bindings, and a path filter
  # would need another action. Kept cheap: the dev profile, one runner, and
  # rust-cache; it does not block the Rust jobs.
  ketch-ffi:
    needs: [config, macos-runner]
    if: >-
      github.event_name != 'issue_comment' &&
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: ${{ fromJSON(needs.macos-runner.outputs.app)[0] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Inline copy of pyrlyn/ci's swift-cache action (pyrlyn/ci#80): re-pin to it once merged.
      - name: Swift build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
            desktop/macos/KetchCore/.build
          key: swift-ffi-${{ runner.os }}-${{ runner.arch }}-xcode-${{ hashFiles('desktop/macos/**/Package.resolved', 'desktop/macos/**/Package.swift', 'desktop/macos/project.yml') }}-${{ github.sha }}
          restore-keys: |
            swift-ffi-${{ runner.os }}-${{ runner.arch }}-xcode-${{ hashFiles('desktop/macos/**/Package.resolved', 'desktop/macos/**/Package.swift', 'desktop/macos/project.yml') }}-
            swift-ffi-${{ runner.os }}-${{ runner.arch }}-xcode-

      - name: XCFramework and bindings
        run: scripts/xcframework.sh --debug

      - name: Swift test
        run: swift test --package-path desktop/macos/KetchCore

  # ketch-ffi as the Windows app will link it: ketch_ffi.dll, the C# bindings
  # the pinned uniffi-bindgen-cs generates from it, and the .NET test that runs
  # the real core against a scratch root through them. What `just csharp-test`
  # runs. The generator and the .NET SDK are mise.toml pins.
  ketch-cs:
    needs: config
    if: >-
      github.event_name != 'issue_comment' &&
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pyrlyn/ci/.github/actions/setup-rust@main
        with:
          install-args: rust dotnet cargo:https://github.com/dennisameling/uniffi-bindgen-cs

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Library and bindings
        run: scripts/csharp.sh --debug

      - name: .NET test
        working-directory: desktop/windows
        run: dotnet test --project KetchCore.Tests

  # ketch-capi as the Linux app will link it: the shared library, and the Vala
  # test Meson builds against vapi/ketch.vapi and runs against a scratch root.
  # What `just capi-test` runs. The header and schema drift tests run in the
  # rust job with the rest of the workspace.
  ketch-capi:
    needs: config
    if: >-
      github.event_name != 'issue_comment' &&
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pyrlyn/ci/.github/actions/setup-rust@main

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # mise has no valac or json-glib, so the Vala toolchain is the
      # distribution's, on the runner only.
      - name: Vala toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends valac meson ninja-build libjson-glib-dev

      - name: Library
        run: cargo build --locked -p ketch-capi

      - name: Vala test
        run: |
          meson setup target/capi-meson crates/ketch-capi -Dcapi_dir="$PWD/target/debug"
          meson test -C target/capi-meson --print-errorlogs

  # The Windows app: the fake core and store tested against the contract
  # scenarios, the adapter onto ketch-ffi (FfiKetchCore) against the real core
  # on a scratch root, then the WinUI 3 project built with the .NET SDK alone
  # (the runner's Visual Studio is not used: the XAML compiler and the Windows
  # SDK build tools come from the Microsoft.WindowsAppSDK package) with
  # ketch_ffi.dll beside it. The tests run on any OS; only the build needs
  # Windows. The .NET SDK and the binding generator are mise.toml pins. The
  # library is the debug build the tests use; a release builds the `ffi`
  # profile (`just csharp`).
  ketch-win-app:
    needs: config
    if: >-
      github.event_name != 'issue_comment' &&
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pyrlyn/ci/.github/actions/setup-rust@main
        with:
          install-args: rust dotnet cargo:https://github.com/dennisameling/uniffi-bindgen-cs

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Library and bindings
        working-directory: .
        run: scripts/csharp.sh --debug

      - name: App core tests
        run: dotnet test --project Ketch.AppCore.Tests

      - name: Adapter tests
        run: dotnet test --project Ketch.FfiCore.Tests

      - name: Build the WinUI app
        run: dotnet build Ketch.App/Ketch.App.csproj -c Release -p:Platform=x64

      # The app cannot start without the core: every Ketch.exe the build wrote
      # has the library beside it.
      - name: The core ships beside the app
        run: |
          python - <<'PY'
          import pathlib
          import sys

          apps = list(pathlib.Path("Ketch.App/bin").rglob("Ketch.exe"))
          if not apps:
              print("the build wrote no Ketch.exe", file=sys.stderr)
              sys.exit(1)
          missing = [app for app in apps if not (app.parent / "ketch_ffi.dll").is_file()]
          if missing:
              print(
                  "ketch_ffi.dll is missing beside " + ", ".join(map(str, missing)),
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

  # The Linux app (desktop/linux): Meson builds the GTK shell and runs the
  # fake core and store against the contract scenarios. What `just linux-app-test`
  # runs for the library; this job also builds the app. The runner's Ubuntu
  # has GTK 4.14 and libadwaita 1.5; the tokens' contrast queries need
  # libadwaita 1.8, which 26.04 ships. The digest is the 26.04 index.
  ketch-linux-app:
    needs: config
    if: >-
      github.event_name != 'issue_comment' &&
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    steps:
      # checkout runs git inside the container, and the image does not ship it.
      - name: Git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # python3-gi and the typelibs are what blueprint-compiler reads GTK and
      # libadwaita's types from. git fetches the pinned subproject.
      - name: Vala and GTK toolchain
        run: |
          apt-get install -y --no-install-recommends gcc libc6-dev valac \
            meson ninja-build pkg-config libjson-glib-dev libgtk-4-dev \
            libadwaita-1-dev python3-gi gir1.2-girepository-3.0 \
            gir1.2-gtk-4.0 gir1.2-adw-1

      - name: Build
        run: |
          meson setup target/linux-app-meson desktop/linux -Dgui=enabled
          meson compile -C target/linux-app-meson

      - name: Test
        run: meson test -C target/linux-app-meson --print-errorlogs

  # The design tokens: every generated copy (Swift, XAML, GTK CSS, DESIGN.md,
  # preview.html) is what desktop/design/build.mjs writes from tokens.json, DESIGN.md passes
  # the DESIGN.md linter, and text meets WCAG AA on its glass backgrounds.
  # Offline after npm ci; the same steps as `just design-check`.
  design:
    needs: config
    if: >-
      github.event_name != 'issue_comment' &&
      !cancelled() && github.event.pull_request.draft != true
      && needs.config.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the Node pin from mise.toml
        id: node_pin
        run: |
          version=$(grep '^node = ' mise.toml | cut -d '"' -f2)
          [ -n "$version" ] || { echo "no node pin found in mise.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node_pin.outputs.version }}

      - name: Design tokens
        run: |
          npm ci
          node desktop/design/build.mjs
          # status, not diff: a generated file nobody committed is untracked.
          [ -z "$(git status --porcelain -- desktop)" ] \
              || { git status --porcelain -- desktop; echo "design tokens are stale: run just design-tokens and commit" >&2; exit 1; }
          node desktop/design/contrast.mjs
          npx --no-install designmd lint desktop/macos/DESIGN.md > lint.json \
              || { cat lint.json; exit 1; }

  # Packaging is exercised on every pull request, so it breaks here rather than
  # halfway through a release, after the merge that started one.
  package:
    # A matrix job skipped at job level reports one check under its raw name, so the required
    # `package (<os>, <target>)` checks would wait: on a docs-only change every step is a no-op.
    needs: [config, macos-runner]
    if: ${{ github.event_name != 'issue_comment' && !cancelled() && github.event.pull_request.draft != true }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.macos-runner.outputs.package) }}
    # `os` stays the label in the check names; `runner` is what the job runs on.
    name: package (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ vars.MACOS_CI_DISABLED == 'true' && (startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'xcode')) && 'ubuntu-latest' || matrix.runner }}
    env:
      RUN: ${{ needs.config.outputs.docs-only != 'true' && !(vars.MACOS_CI_DISABLED == 'true' && (startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'xcode'))) }}
    defaults:
      run:
        shell: bash
    steps:
      # Tags are required by tests/crate-version.sh (latest tag vs Cargo.toml).
      - if: env.RUN == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # dist builds the tarball exactly as release.yml does, with the Rust
      # release.yml installs; git-cliff is what tests/release-sh.sh runs
      # scripts/release.sh against. All three at the versions mise.toml pins.
      # Before rust-cache, so the cache keys on this rustc.
      - if: env.RUN == 'true'
        uses: pyrlyn/ci/.github/actions/setup-rust@main
        with:
          install-args: rust cargo-dist git-cliff

      - if: env.RUN == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - if: env.RUN == 'true'
        name: Shell syntax
        run: |
          bash -n install.sh
          bash -n scripts/release.sh
          bash -n scripts/dist-generate.sh
          bash -n scripts/core-features.sh
          sh tests/release-sh.sh
          sh tests/crate-version.sh
          sh tests/release-workflows.sh
          sh tests/ci-yml-triggers.sh
          sh tests/desktop-release.sh
          python3 tests/desktop_windows_release.py
          sh tests/docs-i18n.sh
          python3 tests/cask_smoke.py
          python3 tests/install_truncation.py

      # src/lib.rs and the core's fuzz entry points exist only under
      # cfg(fuzzing), which no other build sets; checked on stable here so they
      # cannot rot unnoticed again until someone runs the nightly fuzz build.
      # What `just fuzz-check` runs.
      - name: The fuzzing library compiles
        if: env.RUN == 'true' && runner.os == 'macOS'
        env:
          RUSTFLAGS: --cfg fuzzing
        run: cargo check --locked -p ketch -p ketch-core

      # Every other build unifies the core's features into one set, so a
      # feature that compiles only beside another would pass all of them.
      # What `just core-features` runs.
      - name: The core builds with each feature alone
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: scripts/core-features.sh

      # release.yml is generated; a dist-workspace.toml or build-*.yml change
      # without `just dist-generate` would ship a workflow nobody reviewed.
      - name: release.yml is what dist generates
        if: env.RUN == 'true' && runner.os == 'Linux'
        run: |
          DIST=dist scripts/dist-generate.sh
          git diff --exit-code -- .github/workflows/release.yml

      - if: env.RUN == 'true'
        name: Package the host target
        run: dist build --artifacts=local --target ${{ matrix.target }}

      # Everything install.sh relies on: an aggregate SHA256SUMS it can grep, a
      # checksum that verifies, and a `ketch` binary it can find and run.
      - if: env.RUN == 'true'
        name: The tarball is what install.sh expects
        run: |
          cd target/distrib
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 ketch-*.tar.gz > SHA256SUMS
            shasum -a 256 -c SHA256SUMS
            hash() { shasum -a 256 "$1" | awk '{print $1}'; }
          else
            sha256sum ketch-*.tar.gz > SHA256SUMS
            sha256sum -c SHA256SUMS
            hash() { sha256sum "$1" | awk '{print $1}'; }
          fi

          tarball=ketch-${{ matrix.target }}.tar.gz
          expected=$(grep "$tarball" SHA256SUMS | awk '{print $1}')
          actual=$(hash "$tarball")
          [ "$expected" = "$actual" ] || { echo "checksum line unusable" >&2; exit 1; }

          mkdir -p unpacked && tar -xzf "$tarball" -C unpacked
          binary=$(find unpacked \( -name ketch -o -name ketch.exe \) -type f | head -1)
          [ -n "$binary" ] || { echo "no ketch binary in the tarball" >&2; exit 1; }
          "$binary" --version

      # The cask is generated too, and the `tap` job checks it with `brew
      # style` — after the release has published, where a rejected cask leaves
      # the tap a version behind and needs a whole new release to fix. The
      # checksums are placeholders; rubocop only reads the shape of the file.
      # `brew style` applies its cask rules by the `Casks/` directory name.
      - name: The generated cask passes brew style
        if: env.RUN == 'true' && runner.os == 'macOS'
        run: |
          # target/ is gitignored, same as `just lint-cask`: brew style only
          # needs a parent directory named Casks/.
          mkdir -p target/cask/Casks
          scripts/cask.sh 0.0.0 "$(printf '%064d' 0)" > target/cask/Casks/ketch.rb
          brew style target/cask/Casks/ketch.rb

  # A `/review` comment in a pull request re-runs CI on that PR's head by
  # dispatching ci.yml on the PR's branch. The default token cannot dispatch
  # (that needs `workflow_dispatch` callers with write access), so this job
  # only runs where the commenter could push — same visibility as the branch.
  review:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - name: Re-run CI on this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          head="$(gh pr view "$PR" --json headRefOid -q .headRefOid)"
          [ -n "$head" ] || { echo "could not read the head of #$PR" >&2; exit 1; }
          branch="$(gh pr view "$PR" --json headRefName -q .headRefName)"
          repo="$(gh pr view "$PR" --json headRepository -q .headRepository.nameWithOwner)"
          # A fork's headRefName is a branch in the other repository. Dispatching
          # that name here runs whatever this repo calls the same thing — often
          # main — while the comment says it ran on the pull request.
          if [ "$repo" != "pyrlyn/ketch" ]; then
            gh pr comment "$PR" --body "CI was not dispatched: \`$branch\` is in \`$repo\`, not this repository."
            exit 1
          fi
          # Slashes in the branch name must be encoded or the commits API
          # splits them into extra path segments.
          encoded="$(printf '%s' "$branch" | sed 's|/|%2F|g')"
          tip="$(gh api "repos/pyrlyn/ketch/commits/$encoded" --jq .sha)"
          if [ "$tip" != "$head" ]; then
            gh pr comment "$PR" --body "CI was not dispatched: \`$branch\` is \`$tip\`, not the pull request head \`$head\`."
            exit 1
          fi
          # The default token cannot re-run a workflow run, and `gh run rerun`
          # re-runs the whole run including skipped-on-draft jobs — so dispatch
          # CI fresh on the PR's branch instead. A dispatch on the branch runs
          # the pull_request jobs below against the same head.
          gh workflow run ci.yml --ref "$branch"
          gh pr comment "$PR" --body "CI dispatched on \`$branch\` (\`$head\`)."

  # Fails when workspace-hack drifts from the dependency graph (cargo-hakari
  # comes from mise.toml). Own job, so the required check names stay as they are.
  hakari:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # Only what the check needs, not every tool in mise.toml. sccache too:
          # mise refuses a cargo: tool while the sccache in mise.toml is missing.
          install_args: rust sccache cargo:cargo-hakari
      - run: cargo hakari generate --diff
      - run: cargo hakari manage-deps --dry-run
      - run: cargo hakari verify
