# Publishes this repo's docs/ to the public site repository pyrlyn/landing (pyrlyn/ci's
# sync-docs.yml): docs/site.md becomes the project card, every other user-facing docs/**/*.md
# goes to content/docs/ketch/ (mirrored). Internal pages are left out by the shared filter. On a
# v* tag or release the card's `version:` is set from the tag. Auth: the SITE_DEPLOY_KEY deploy
# key on pyrlyn/landing; GITHUB_TOKEN stays read-only.
# Inputs: https://github.com/pyrlyn/ci/blob/main/docs/reusable-workflows.md
name: sync-docs

on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so every v* tag syncs.
    paths: [docs/**, .github/workflows/sync-docs.yml]
    tags: ["v*"]
  # A tag pushed with GITHUB_TOKEN triggers no workflow, so also sync when a release is published.
  release:
    types: [published]
  workflow_dispatch:

# One sync at a time per source repo, never cancelled half-way.
concurrency:
  group: sync-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    # The macOS app's releases (desktop-v*, and the desktop-appcast feed) are
    # not the CLI's version: the card would read "desktop-v1.0.0".
    if: github.ref_type != 'tag' || startsWith(github.ref_name, 'v')
    uses: pyrlyn/ci/.github/workflows/sync-docs.yml@341896b491b89d93a1940313c0149ddfd8fae9c2 # main
    permissions:
      contents: read
    secrets:
      SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
