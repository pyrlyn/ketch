# Build speed: the shared-settings recommended defaults (templates/gradle.properties).
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
kotlin.daemon.jvmargs=-Xmx4g
kotlin.incremental.native=true
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
# Set to true (or -Pdiffuser.allTargets=true) to add linuxX64 and linuxArm64 next to macosArm64.
diffuser.allTargets=false
diffuser.release.fast=false
# Release binary size: smallBinary, latin1 strings and strip (shared.settings.native).
diffuser.releaseSize=all
