[package]
name = "ketch-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Everything ketch does besides parsing its command line: resolving, fetching, verifying, unpacking and linking client apps."
license.workspace = true
repository.workspace = true
# Linked into the `ketch` binary, never released on its own.
publish = false

# dist builds the `ketch` binary only; this crate has none to package.
[package.metadata.dist]
dist = false

# Each heavy subsystem is a feature, so a front end links only what it uses.
# The defaults are everything: the `ketch` binary takes them as they are, and
# `ketch-ffi` turns them off and names its own set. `scripts/core-features.sh`
# builds the core with none of them and with each one alone.
[features]
default = ["stats", "push", "trust", "gzip", "xz", "bzip2", "zip"]
# `stats.db`, the install history: diesel over a bundled SQLite. Without it an
# install records nothing, and `stats::history`/`summary` do not exist.
stats = ["dep:diesel", "dep:diesel_migrations", "dep:libsqlite3-sys"]
# `ketch registry push`: octocrab, and the tokio runtime it blocks on. Without
# it there is no `push` module.
push = ["dep:octocrab", "dep:tokio"]
# Publisher signatures: sigstore, minisign and OpenPGP. Without it a manifest's
# `trust` table can never be satisfied, so `require` refuses the install.
trust = ["dep:sigstore", "dep:minisign-verify", "dep:pgp"]
# Archive codecs, one each. Plain tar is always built (the tar crate is small
# and has no dependencies of its own); a file whose codec is left out is
# refused as an unsupported format rather than installed as a program.
gzip = ["dep:flate2"]
xz = ["dep:lzma-rs"]
bzip2 = ["dep:bzip2"]
zip = ["dep:zip"]

[dependencies]
# `shell::Shell` is a clap `ValueEnum` and `CompletionShell` maps onto
# `clap_complete::Shell`; the command line itself lives in the binary.
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Writing a chosen `bin` back into a user manifest without touching the rest
# of the file, comments and layout included; `toml` alone would re-render it.
toml_edit = "0.25"
# `ketch import winget` reads winget-pkgs installer manifests, which are
# YAML; serde_yaml is deprecated and serde-saphyr is the maintained one.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
ureq = { version = "2", features = ["json", "proxy-from-env"] }
sha2 = "0.11"
hex = "0.4"
flate2 = { version = "1", optional = true }
bzip2 = { version = "0.6", optional = true }
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }
lzma-rs = { version = "0.3", optional = true }
walkdir = "2"
semver = "1"
tempfile = "3"
dirs = "7"
# canonicalize without Windows `\\?\` UNC prefixes, atomic writes, tree copy and removal
fs-kit.workspace = true
# relative path between two absolute paths (copy_tree, platform link checks)
pathdiff = "0.2"
# parse Windows archive member paths correctly on any host (zip-slip guard)
typed-path = "0.12"
thiserror = "2"
diesel = { version = "2.3", features = ["sqlite", "returning_clauses_for_sqlite_3_35"], optional = true }
diesel_migrations = { version = "2.3", optional = true }
# `bundled` compiles SQLite into the binary. Linking the system one would make
# ketch's single-binary promise depend on what the host happens to ship, and
# the release builds both macOS architectures where that answer differs.
libsqlite3-sys = { version = "0.38.2", features = ["bundled"], optional = true }
# `ketch registry push` talks to GitHub through octocrab rather than the ureq
# client the sources use: it needs forks, refs, contents and pull requests,
# which octocrab already types and paginates. It is async, hence tokio for a
# runtime to block on; everything else in ketch stays synchronous.
octocrab = { version = "0.54", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
# Publisher signatures (the manifest's `trust` table). Verification only:
# sigstore without its signing, OCI and TUF-fetching halves, rPGP without
# bzip2 (signatures are never compressed), minisign-verify has no deps.
sigstore = { version = "0.14", default-features = false, features = ["verify"], optional = true }
minisign-verify = { version = "0.3", optional = true }
pgp = { version = "0.20", default-features = false, optional = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[dev-dependencies]
insta = "1.48"
pretty_assertions = "1.4.1"
proptest = "1.11"
rstest = "0.26"
# Only the schema drift tests use it; the derives are `cfg_attr(test, ...)`.
schemars = "1.2"
# Checks that the files ketch ships validate against the schemas it publishes.
# Without default features it resolves no remote or file `$ref`, so the tests
# stay offline.
jsonschema = { version = "0.58", default-features = false }

[lints]
workspace = true
